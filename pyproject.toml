[project]
name = "marketwatch"
version = "1.0.0"
description = "Monitor de mercado Wallapop/Vinted para hardware y juegos retro de Nintendo DS"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
