[project]
name = "wallabot"
version = "0.0.0"
description = "Market intelligence for retro Nintendo DS listings on Wallapop and Vinted"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.50",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
